<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle Obras GrupoVax</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><small>GRUPOVAX • MANUTENÇÃO E OBRAS</small><h1>Controle de demandas</h1></div><div id="session"></div></header><main>
<p id="message" role="status" aria-live="polite"></p>
<section id="login"><h2>Acessar acompanhamento</h2><form id="login-form"><label>Usuário<input name="username" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section>
<div id="app" hidden><nav><button id="list-view">Acompanhamento operacional</button><button id="admin-view" hidden>Administração • nova demanda</button><button id="logout">Sair</button></nav>
<section id="create" hidden><h2 id="form-title">Nova demanda • 5W2H</h2><form id="demand-form"><div class="grid">
<label>Título<input name="title" required maxlength="200"></label><label>Tipo<select name="type"><option>Manutenção</option><option>Obra</option></select></label>
<label>Prioridade<select name="priority"><option>Baixa</option><option selected>Média</option><option>Alta</option></select></label><label>Urgência<select name="urgency"><option>Normal</option><option>Urgente</option><option>Imediata</option></select></label>
<label>O que será feito?<textarea name="what" required></textarea></label><label>Por quê?<textarea name="why" required></textarea></label><label>Onde?<input name="where" required></label><label>Quando? Prazo<input name="when" type="date" required></label><label>Quem? Envolvidos<input name="who" required></label><label>Como?<textarea name="how" required></textarea></label><label>Quanto? Custo previsto (R$)<input name="cost" type="number" min="0" step="0.01" required value="0"></label><label>Equipe<input name="team" required></label><label>Responsável<input name="responsible" required></label></div><button>Salvar demanda</button></form></section>
<section id="tracking"><div class="section-title"><h2>Demandas</h2><span id="count"></span></div><div class="filters"><label>Buscar título, local ou responsável<input id="search" type="search"></label><label>Status<select id="status-filter"><option value="">Todos</option><option>Aberta</option><option>Em andamento</option><option>Bloqueada</option><option>Concluída</option></select></label><button id="refresh">Atualizar</button></div><div id="demands"></div></section>
<section id="detail" hidden></section></div></main><script type="module" src="/app.js"></script></body></html>
